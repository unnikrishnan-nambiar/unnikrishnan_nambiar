name: Deploy to GitHub Pages

# Plain static site: no install, no build. This job only copies the public
# files into _site/ so docs, mockups, tools/ and the guide template never get
# published.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect public files
        run: |
          mkdir _site
          cp -R index.html 404.html .nojekyll favicon.svg favicon-32.png apple-touch-icon.png assets g _site/
          rm -rf _site/g/_template

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
