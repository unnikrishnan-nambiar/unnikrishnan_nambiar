name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/ryx-ai-website-ozme2m
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GitHub Pages is static-only and can't run this route handler.
      # The Join form detects NEXT_PUBLIC_STATIC_SITE and shows a fallback
      # instead of trying to submit to it.
      - name: Remove API routes (unsupported by static export)
        run: rm -rf app/api

      - name: Build static export
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_STATIC_SITE: 'true'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
